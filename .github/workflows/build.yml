name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Backend base URL (e.g. https://asanamul-voice-master.onrender.com)"
        required: true
        default: "https://YOUR_DOMAIN"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # NOTE: android-actions/setup-android@v3 was REMOVED (2026-11-18) —
      # its internal sdkmanager call fails on cmdline-tools 16.0
      # ("Failed to find package 'tools' / 'platform-tools'", exit 1).
      # The ubuntu-latest runner already ships a full Android SDK
      # (ANDROID_HOME) with licenses pre-accepted; Gradle/AGP uses it
      # directly and auto-downloads any missing component.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "no build-tools dir"
      - name: Build release APK (unsigned)
        working-directory: android
        run: gradle :app:assembleRelease -PANAMUL_SERVER_URL="${{ inputs.server_url }}" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
